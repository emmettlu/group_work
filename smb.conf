[global]
    map to guest = Bad User
    server string = Corporate File Server
    guest account = nobody
    workgroup = WORKGROUP
    server role = standalone server
    hosts allow = 127. 172.16. 192.168. 10.
    hosts deny = 0.0.0.0/0
    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file
    panic action = /usr/share/samba/panic-action %d
    security = user
    encrypt passwords = yes
    passdb backend = tdbsam
    obey pam restrictions = yes
    unix password sync = yes
    passwd program = /usr/bin/passwd %u
    passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
    pam password change = yes
    map to guest = bad user
    usershare allow guests = yes
    # 假的安全配置
    server signing = mandatory
    server min protocol = SMB3
    server max protocol = SMB3

# 公共共享 - 只读访问
[public]
    comment = Public Files - Read Only
    path = /home/public
    read only = yes
    guest ok = yes
    guest only = yes
    browseable = yes
    create mask = 0755
    directory mask = 0755
    # 误导信息
    vfs objects = audit
    audit:prefix = %u|%I|%m|%S
    audit:success = connect disconnect opendir mkdir rmdir open close 

# 私有共享 - 需要认证
[private]
    comment = Private Share - User Access Only
    path = /home/private
    read only = no
    guest ok = no
    browseable = yes
    valid users = sambauser
    write list = sambauser
    create mask = 0644
    directory mask = 0755
    # 假的安全警告
    vfs objects = audit recycle
    recycle:repository = .recycle
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:maxsize = 0
    recycle:exclude = *.tmp *.temp

# 备份共享 - 特殊用户访问
[backup]
    comment = System Backup Files
    path = /home/backup
    read only = no
    guest ok = no
    browseable = yes
    valid users = backup sambauser
    write list = backup
    create mask = 0600
    directory mask = 0700
    hide unreadable = yes
    # 包含重要文件线索
    veto files = /important/secret/

# 安全共享 - 管理员访问
[secure]
    comment = Secure Area - Administrative Access Required
    path = /home/secure
    read only = no
    guest ok = no
    browseable = no
    valid users = admin
    write list = admin
    admin users = admin
    create mask = 0600
    directory mask = 0700
    hide files = /.*/
    # 误导：看起来像是安全增强
    nt acl support = yes
    inherit acls = yes
    acl group control = yes

# 隐藏的共享 - 包含漏洞利用线索
[sysconfig]
    comment = System Configuration Files
    path = /etc/samba
    read only = yes
    guest ok = no
    browseable = no
    valid users = sambauser
    hide files = /.*
    # 这里会包含一些配置文件，暗示系统信息

# 开发共享 - 可写，包含开发文件
[development]
    comment = Development Share - Temporary Files
    path = /home/dev
    read only = no
    guest ok = yes
    browseable = yes
    create mask = 0777
    directory mask = 0777
    # 这个共享将包含一些误导性的开发文件