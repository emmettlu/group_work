version: "3"
services:
  # 主要的Samba服务器 - 包含CVE-2017-7494漏洞
  samba:
    image: vulhub/samba:4.6.3
    tty: true
    hostname: fileserver
    volumes:
      - ./smb.conf:/usr/local/samba/etc/smb.conf
      - ./scripts:/scripts
    ports:
      - "445:445"
      - "139:139"
    command: sh -c "
      useradd sambauser 2>/dev/null || true &&
      (echo 'sambapass'; echo 'sambapass') | smbpasswd -a sambauser &&
      useradd admin 2>/dev/null || true &&
      (echo 'AdminPass123!'; echo 'AdminPass123!') | smbpasswd -a admin &&
      useradd backup 2>/dev/null || true &&
      (echo 'BackupPass456'; echo 'BackupPass456') | smbpasswd -a backup &&
      mkdir -p /home/private /home/public /home/backup /home/secure /home/dev /var/log/security &&
      chown sambauser /home/private &&
      chown admin /home/secure &&
      chown backup /home/backup &&
      chmod 755 /home/private /home/public /home/backup /home/secure /home/dev &&
      echo 'Welcome to the private share. Server is running Samba 4.6.4 (patched version).' > /home/private/readme.txt &&
      echo 'This is a public share with read-only access.' > /home/public/info.txt &&
      echo 'Backup files are stored here. Access restricted to backup users.' > /home/backup/backup_info.txt &&
      echo 'SECURE AREA - AUTHORIZED PERSONNEL ONLY' > /home/secure/CLASSIFIED.txt &&
      echo 'system32.dll' > /home/secure/system32.dll &&
      echo 'Samba Version 4.6.4 (Security Patched - Latest)' > /home/secure/version_info.txt &&
      echo 'Last security update: 2024-01-15' >> /home/secure/version_info.txt &&
      echo 'Next vulnerability scan: 2024-02-01' >> /home/secure/version_info.txt &&
      chown sambauser /home/private/readme.txt &&
      chown backup /home/backup/backup_info.txt &&
      chown admin /home/secure/CLASSIFIED.txt /home/secure/system32.dll /home/secure/version_info.txt &&
      chmod 644 /home/secure/CLASSIFIED.txt /home/secure/system32.dll /home/secure/version_info.txt &&
      # 创建假的配置文件
      echo '[global]' > /home/secure/smb.conf.leak &&
      echo '    server string = Corporate File Server 4.6.4' >> /home/secure/smb.conf.leak &&
      echo '    security = user' >> /home/secure/smb.conf.leak &&
      echo '    encrypt passwords = yes' >> /home/secure/smb.conf.leak &&
      echo '    server signing = mandatory' >> /home/secure/smb.conf.leak &&
      echo '    # Security enhanced - all vulnerabilities patched' >> /home/secure/smb.conf.leak &&
      chown admin /home/secure/smb.conf.leak &&
      # 创建开发文件
      echo '# Development environment configuration' > /home/dev/dev_notes.txt &&
      echo '# Server running latest Samba 4.6.4 with all security patches' >> /home/dev/dev_notes.txt &&
      echo '# All file uploads are scanned for malware' >> /home/dev/dev_notes.txt &&
      echo '# Database connections are encrypted' >> /home/dev/dev_notes.txt &&
      echo '# Physical paths: /home/share for public, /home/secure for admin' >> /home/dev/dev_notes.txt &&
      chown sambauser /home/dev/dev_notes.txt &&
      # 创建 flag 文件（只有 root 可以读取）
      mkdir -p /root &&
      echo 'flag{sambacry_cve_2017_7494_master}' > /root/flag.txt &&
      chmod 600 /root/flag.txt &&
      # 创建假的日志文件
      echo '[$(date)] Security scan completed - No vulnerabilities found' > /var/log/security/scan.log &&
      echo '[$(date)] Firewall rules updated - All ports secured' >> /var/log/security/scan.log &&
      echo '[$(date)] System integrity check passed' >> /var/log/security/scan.log &&
      echo '[$(date)] Samba 4.6.4 security patch verified' >> /var/log/security/scan.log &&
      # 执行设置脚本（如果存在）
      if [ -f /scripts/setup.sh ]; then
        chmod +x /scripts/setup.sh
        /scripts/setup.sh
      fi &&
      /start.sh"
    networks:
      - internal

  # Web应用服务器 - 包含多个漏洞和误导
  web:
    image: php:7.2-apache
    hostname: webserver
    volumes:
      - ./web:/var/www/html
      - ./logs:/var/log/apache2
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - samba
      - db
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    networks:
      - internal

  # 数据库服务器
  db:
    image: mysql:5.7
    hostname: database
    environment:
      MYSQL_ROOT_PASSWORD: RootPass789!
      MYSQL_DATABASE: corporate_db
      MYSQL_USER: webuser
      MYSQL_PASSWORD: WebPass456!
    volumes:
      - ./db:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - internal

  # 假的安全监控服务器
  security:
    image: nginx:alpine
    hostname: security-monitor
    volumes:
      - ./security:/usr/share/nginx/html
    ports:
      - "8081:80"
    networks:
      - internal

  # SSH蜜罐服务器
  ssh:
    image: cowrie/cowrie:latest
    hostname: ssh-gateway
    ports:
      - "2222:2222"
    environment:
      - COWRIE_LISTEN_PORT=2222
    volumes:
      - ./ssh-data:/cowrie/cowrie-git/var/log/cowrie
    networks:
      - internal

networks:
  internal:
    driver: bridge