version: "3.8"

services:
  # 核心漏洞服务 - Samba 4.6.3
  samba:
    image: vulhub/samba:4.6.3
    container_name: filehub_samba
    hostname: fileserver
    tty: true
    volumes:
      - ./smb.conf:/usr/local/samba/etc/smb.conf
      - ./samba/share:/home/share
    ports:
      - "445:445"
    networks:
      filehub_net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  # Web 应用服务
  web:
    image: php:7.4-apache
    container_name: filehub_web
    hostname: webserver
    volumes:
      - ./www:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/php.ini
    ports:
      - "80:80"
    depends_on:
      - mysql
      - samba
    networks:
      filehub_net:
        ipv4_address: 172.20.0.20
    environment:
      - DB_HOST=mysql
      - DB_USER=webapp
      - DB_PASS=W3bApp_P@ss2023
      - DB_NAME=filehub
    restart: unless-stopped

  # MySQL 数据库
  mysql:
    image: mysql:5.7
    container_name: filehub_mysql
    hostname: dbserver
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/fake_data.sql:/docker-entrypoint-initdb.d/02-data.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      filehub_net:
        ipv4_address: 172.20.0.30
    environment:
      - MYSQL_ROOT_PASSWORD=R00t_MyS3cret!
      - MYSQL_DATABASE=filehub
      - MYSQL_USER=webapp
      - MYSQL_PASSWORD=W3bApp_P@ss2023
    restart: unless-stopped

  # 假 FTP 服务 (vsftpd 2.3.4 蜜罐)
  fake_ftp:
    image: python:3.9-slim
    container_name: filehub_ftp
    hostname: ftpserver
    volumes:
      - ./services/fake_ftp.py:/app/fake_ftp.py
    ports:
      - "21:21"
    networks:
      filehub_net:
        ipv4_address: 172.20.0.40
    command: python /app/fake_ftp.py
    restart: unless-stopped

  # 假 Tomcat 管理后台
  fake_tomcat:
    image: nginx:alpine
    container_name: filehub_tomcat
    hostname: tomcatserver
    volumes:
      - ./services/fake_tomcat:/usr/share/nginx/html
      - ./services/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:8080"
    networks:
      filehub_net:
        ipv4_address: 172.20.0.50
    restart: unless-stopped

  # 监控和日志服务（可选）
  monitor:
    image: alpine:latest
    container_name: filehub_monitor
    hostname: monitor
    volumes:
      - ./services/monitor.sh:/monitor.sh
      - ./logs:/var/log/filehub
    networks:
      filehub_net:
        ipv4_address: 172.20.0.100
    command: sh /monitor.sh
    restart: unless-stopped

networks:
  filehub_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  mysql_data:
    driver: local
